<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguridad Social</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
    }

    header {
      background-color: #005ca9;
      color: white;
      text-align: center;
      padding: 20px;
    }

    header img {
      width: 120px;
      margin-bottom: 10px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #005ca9;
      text-align: center;
    }

    p {
      color: #444;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 12px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: none;
      font-size: 16px;
    }

    button {
      background-color: #005ca9;
      color: white;
      border: none;
      padding: 12px 25px;
      margin-top: 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #004080;
    }

    .mensaje {
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/TGSS.svg" alt="Seguridad Social">
    <h2>Portal de Atención Ciudadana</h2>
  </header>

  <div class="container">
    <h1>Consulta o Solicitud</h1>

    <p>
      Escriba su consulta o información en el siguiente apartado.
    </p>

    <textarea id="textoUsuario" placeholder="Escriba aquí..."></textarea>

    <button onclick="enviarTexto()">Enviar</button>

    <div class="mensaje" id="mensaje"></div>
  </div>

  <script>
    function enviarTexto() {
      let texto = document.getElementById("textoUsuario").value;
      let mensaje = document.getElementById("mensaje");

      if(texto.trim() === "") {
        mensaje.style.color = "red";
        mensaje.innerHTML = "Por favor, escriba un mensaje.";
      } else {
        mensaje.style.color = "green";
        mensaje.innerHTML = "Mensaje enviado correctamente.";
      }
    }
  </script>

</body>
</html>
